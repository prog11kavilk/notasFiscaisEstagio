$kind: http-request
name: 'PUT nota 1002 - troca itens'
method: PUT
url: '{{baseUrl}}/nf/nota_fiscal/update/1002'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "clienteCodigo": "C002",
      "itens": [
        {
          "item": 3,
          "produtoCodigo": "P003",
          "quantidade": 2
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('total 1799.80', () => pm.expect(pm.response.json().valorTotal).to.eql(1799.8));
