$kind: http-request
name: 'GET itens da nota 1001'
method: GET
url: '{{baseUrl}}/nf/itens/nota/1001'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('3 itens', () => pm.expect(pm.response.json().length).to.eql(3));
