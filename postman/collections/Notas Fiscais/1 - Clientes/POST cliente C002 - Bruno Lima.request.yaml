$kind: http-request
name: 'POST cliente C002 - Bruno Lima'
method: POST
url: '{{baseUrl}}/nf/clientes/create'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "codigo": "C002",
      "nome": "Bruno Lima",
      "cpf": "11144477735"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('devolve codigo C002 e não expõe id', () => { const j = pm.response.json(); pm.expect(j.codigo).to.eql('C002'); pm.expect(j).to.not.have.property('id'); });
