$kind: http-request
name: 'POST cliente C001 - Ana Souza'
method: POST
url: '{{baseUrl}}/nf/clientes/create'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "codigo": "C001",
      "nome": "Ana Souza",
      "cpf": "52998224725"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('devolve codigo C001 e não expõe id', () => { const j = pm.response.json(); pm.expect(j.codigo).to.eql('C001'); pm.expect(j).to.not.have.property('id'); });
