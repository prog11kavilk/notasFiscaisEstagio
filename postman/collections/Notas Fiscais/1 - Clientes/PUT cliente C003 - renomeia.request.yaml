$kind: http-request
name: 'PUT cliente C003 - renomeia'
method: PUT
url: '{{baseUrl}}/nf/clientes/update/C003'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Carla Mendes Silva",
      "cpf": "39053344705"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('código não muda', () => pm.expect(pm.response.json().codigo).to.eql('C003'));
