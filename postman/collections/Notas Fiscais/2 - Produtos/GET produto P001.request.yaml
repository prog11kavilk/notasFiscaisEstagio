$kind: http-request
name: 'GET produto P001'
method: GET
url: '{{baseUrl}}/nf/produtos/P001'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('valor', () => pm.expect(pm.response.json().valor).to.eql(120.5));
