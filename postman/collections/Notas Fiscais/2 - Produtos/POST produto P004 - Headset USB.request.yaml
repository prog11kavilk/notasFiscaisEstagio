$kind: http-request
name: 'POST produto P004 - Headset USB'
method: POST
url: '{{baseUrl}}/nf/produtos/create'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "codigo": "P004",
      "nome": "Headset USB",
      "valor": 210.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('devolve codigo P004', () => pm.expect(pm.response.json().codigo).to.eql('P004'));
