$kind: http-request
name: 'POST produto P003 - Monitor 24'
method: POST
url: '{{baseUrl}}/nf/produtos/create'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "codigo": "P003",
      "nome": "Monitor 24\"",
      "valor": 899.9
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('devolve codigo P003', () => pm.expect(pm.response.json().codigo).to.eql('P003'));
