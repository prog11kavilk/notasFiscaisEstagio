$kind: http-request
name: 'POST produto P002 - Mouse Óptico'
method: POST
url: '{{baseUrl}}/nf/produtos/create'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "codigo": "P002",
      "nome": "Mouse Óptico",
      "valor": 50.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('devolve codigo P002', () => pm.expect(pm.response.json().codigo).to.eql('P002'));
