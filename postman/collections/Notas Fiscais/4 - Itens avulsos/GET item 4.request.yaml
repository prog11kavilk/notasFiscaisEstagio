$kind: http-request
name: 'GET item 4'
method: GET
url: '{{baseUrl}}/nf/itens/item/4'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('produtoNome', () => pm.expect(pm.response.json().produtoNome).to.eql('Headset USB'));
