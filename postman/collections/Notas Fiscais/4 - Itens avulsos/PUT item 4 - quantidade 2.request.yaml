$kind: http-request
name: 'PUT item 4 - quantidade 2'
method: PUT
url: '{{baseUrl}}/nf/itens/nota/1001/update/4'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "quantidade": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('total 420', () => pm.expect(pm.response.json().valorTotal).to.eql(420));
