# Sobe o banco de dados (PostgreSQL) do projeto.
# Funciona em qualquer máquina com Docker: docker compose up -d
# Para trocar usuário, senha ou porta, copie .env.example para .env.
services:
  db:
    image: postgres:17
    container_name: notafiscal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: notaFiscal_db
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - notafiscal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d notaFiscal_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # guarda os dados do banco mesmo se o contêiner for apagado
  notafiscal_data:
