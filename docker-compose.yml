# Banco Postgres do projeto.
# Uso: copie .env.example para .env, preencha usuário/senha e rode: docker compose up -d
services:
  db:
    image: postgres:17
    container_name: notafiscal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: notaFiscal_db
    ports:
      # porta do host configurável; o padrão acompanha a URL do application.properties
      - "${DB_PORT:-5434}:5432"
    volumes:
      - notafiscal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d notaFiscal_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notafiscal_data:
    # mesmo nome do volume criado antes com 'docker run', para reaproveitar os dados
    name: notafiscal_data
