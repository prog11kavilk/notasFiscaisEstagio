#Configurações da aplicação e database JPA
spring.application.name=notasFiscaisEstagio
spring.datasource.url=jdbc:postgresql://localhost:5434/notaFiscal_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#mostra a mensagem das Exceções dos CRUD no corpo da resposta
spring.web.error.include-message=always
